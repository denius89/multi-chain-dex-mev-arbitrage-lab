[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-chain-arb-lab"
version = "0.1.0"
description = "Research utilities for normalized multi-chain DEX/MEV opportunity analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Multi-Chain DEX & MEV Arbitrage Lab contributors"}]

[project.scripts]
arb-lab = "arb_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
